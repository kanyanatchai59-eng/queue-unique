s signing round", "วันใหม่": "New date", "เวลาเริ่มใหม่": "New start time", "เหตุผล (ผู้ขอจะเห็น)": "Reason (the requester will see this)", "ดูผลก่อนย้าย": "Preview the move", "ยืนยันการเลื่อนรอบ": "Confirm moving the round", "คิวทุกคิวในรอบนี้จะย้ายไปวันใหม่พร้อมกัน ผู้ขอทุกคนจะได้รับแจ้งเตือนให้กดรับทราบ หรือขอรอบอื่น ถ้าไม่สะดวกและไม่มีรอบอื่น คิวจะถูกยกเลิกและเก็บเรื่องไว้เป็นดราฟ": "Every queue in this round moves to the new date together. Each requester is notified to accept or ask for another round. If a requester cannot make it and no other round is open, the queue is cancelled and the request is kept as a draft.", "รอบนี้ยังไม่มีคิว ย้ายได้ทันที": "This round has no queues yet, so it can be moved right away", "วันและเวลาใหม่ทับรอบที่มีอยู่แล้ว": "The new date and time clash with an existing round", "ไม่มีรอบอื่นให้เลือก": "No other round is available", "เก็บเป็นดราฟและยกเลิกคิว": "Keep as a draft and cancel the queue", "ยังไม่มีรอบเซ็นอื่นที่ยังว่าง ระบบจะยกเลิกคิวนี้และเก็บเรื่องกับไฟล์แนบไว้เป็นดราฟ เมื่อเลขาเปิดรอบใหม่ให้กด \"จองรอบใหม่\" ได้ทันที": "No other signing round has space right now. This queue will be cancelled and your subject and attachments kept as a draft, so you can tap \"Book again\" as soon as a secretary opens a new round.", "เลือกรอบใหม่ที่คุณสะดวก คิวนี้จะย้ายทันทีโดยไม่ต้องรอตรวจใหม่": "Pick a round that works for you. The queue moves immediately, with no new review needed.", "ไม่สะดวกทุกรอบ เก็บเป็นดราฟ": "None of these work, keep as a draft", "ย้ายไปรอบนี้": "Move to this round", "ยืนยันคิวแล้ว ส่งถึงผู้บริหารเลย": "Queue confirmed and sent straight to the executive", "คิวนี้ยืนยันแล้วเพราะเลขาเป็นผู้จองเอง ไม่ต้องรอใครตรวจ": "This queue is already confirmed because a secretary booked it, so no review is needed", "ทดลองกดแทน": "Act on their behalf", "หยุดกดแทน": "Stop acting", "กดแทนได้ ทุกการกดถูกบันทึกชื่อคุณ": "you can act on their behalf · every action is recorded under your name", "ทดลองกดแทนผู้ใช้คนนี้": "Act on behalf of this user", "เปิดโหมดกดแทน": "Turn on acting mode", "กลับเป็นดูอย่างเดียวแล้ว": "Back to view only", "เปิดโหมดกดแทนแล้ว": "Acting mode is on", "ส่งทดสอบ": "Send test", "เขียนประกาศ": "Write an announcement", "ส่งประกาศ": "Send the announcement", "ยืนยันการส่งประกาศ": "Confirm sending the announcement", "ส่งเลย": "Send now", "ข้อความ": "Message", "ประกาศรอบเซ็นเอกสาร": "Signing round announcement", "ส่งข้อความเดียวถึงทุกบัญชีที่เปิดใช้งาน เช่น ประกาศรอบเซ็นของสัปดาห์นี้ คนที่เชื่อม LINE ไว้จะได้รับในแชท LINE ทันที คนที่ไม่ได้เชื่อมจะได้รับทางอีเมลหรือ Teams และทุกคนเห็นในกระดิ่งแจ้งเตือนของระบบ": "Send one message to every active account, for example this week's signing rounds. People linked to LINE get it in LINE straight away, everyone else gets it by email or Teams, and all of them see it in the notification bell.", "ลบบัญชีนี้ออกจากระบบถาวร (ทำได้เมื่อบัญชีนี้ยังไม่มีคำขอ)": "Delete this account permanently (only possible while it has no requests)", "ลบบัญชีถาวร": "Delete account permanently", "ลบบัญชีนี้": "Delete this account", "ลบบัญชีแล้ว": "Account deleted", "สร้างข้อมูลทดสอบ": "Create test data", "ล้างข้อมูลทดสอบ": "Clear test data", "Reset ล้างข้อมูลทั้งหมด": "Reset and clear all data", "สร้างข้อมูลทดสอบเสมือนใช้งานจริง": "Create realistic test data", "ข้อมูลทดสอบใช้ชื่อพนักงานจริงที่เปิดใช้งานอยู่ มีรอบย้อนหลัง 8 สัปดาห์ รอบที่กำลังจะถึง และไฟล์แนบตัวอย่างที่เปิดดูได้ เพื่อให้ลองหน้าจอได้เสมือนใช้งานจริง ระบบไม่ส่งแจ้งเตือนตอนสร้าง": "Test data uses the real active employees, with eight weeks of past rounds, upcoming rounds and sample attachments you can open, so the screens look like real use. Nothing is notified when it is created.", "ระบบจะสร้างรอบเซ็นย้อนหลังและรอบที่กำลังจะถึง พร้อมคำขอในชื่อพนักงานจริงที่เปิดใช้งานอยู่ หัวข้อขึ้นต้นด้วย [TEST] และมีไฟล์แนบตัวอย่างเป็น PDF ที่เปิดดูได้จริง ทั้งหมดนี้ไม่ส่งแจ้งเตือนถึงใคร และกดล้างทิ้งทีเดียวได้": "The system creates past and upcoming signing rounds with requests under the names of real active employees. Every subject starts with [TEST] and some have real sample PDF attachments. Nobody is notified, and you can clear it all with one button.", "จองคิวสำเร็จ": "Queue booked", "มีคำขอนัดหมายใหม่": "New appointment request", "ผู้ขอยกเลิกคิว": "The requester cancelled their queue", "ผู้บริหารข้ามขั้นเลขาแล้ว": "The executive skipped the secretary step", "คำขอต้องแก้ไขเพิ่มเติม": "Your request needs changes", "คำขอไม่ได้รับคิว": "Your request did not get a queue", "มีคำขอเปลี่ยนแปลงคิว": "A request to change a queue", "อนุมัติการยกเลิกคิวแล้ว": "Your cancellation was approved", "อนุมัติการเลื่อนนัดแล้ว": "Your reschedule was approved", "ไม่อนุมัติการเปลี่ยนแปลงคิว": "Your change request was not approved", "เตือนนัดหมาย": "Appointment reminder", "สรุปงานเซ็นเอกสารวันนี้": "Today's signing summary", "เวลาคิวของคุณเปลี่ยน": "Your queue time has changed", "ใกล้ถึงคิวของคุณ": "Your turn is coming up", "ถึงคิวของคุณแล้ว": "It is your turn now", "มีผู้ขอใช้งานระบบ": "Someone requested access to the system", "บัญชีของคุณพร้อมใช้งานแล้ว": "Your account is ready to use", "เปิดระบบ": "Open the system", "สวัสดีค่ะ น้องยูนิคเองค่ะ": "Hi, I'm Unik!", "ยูนิคจะพาดูทีละปุ่มว่าพนักงานจองคิวเซ็นเอกสารอย่างไร ใช้เวลาประมาณ 1 นาที ระหว่างเรียนจะไม่มีการส่งคำขอจริงค่ะ": "I'll show you, button by button, how staff book a signing queue. It takes about a minute, and nothing is actually submitted during the tour.", "ปุ่ม \"จองคิวใหม่\"": "The \"New booking\" button", "เริ่มจองคิวเข้าพบผู้บริหารจากปุ่มนี้ ลองกดที่ปุ่มได้เลยค่ะ หรือกด \"ถัดไป\" ให้ยูนิคพาไป": "Start booking a meeting with the executive here. Try tapping it, or press \"Next\" and I'll take you there.", "ขั้นที่ 1 เลือกวัน": "Step 1: Pick a day", "แต่ละกล่องคือรอบเซ็นที่เปิดรับคิว คำว่า \"ว่าง\" ตามด้วยตัวเลขคือจำนวนช่องที่ยังจองได้ กดกล่องของวันที่ต้องการ": "Each box is a signing round that is open for booking. The number marked \"free\" is how many slots are left. Tap the day you want.", "ถ้ามีหลายเรื่องหรือเอกสารเยอะ กดเครื่องหมายบวกเพื่อขอเวลาเพิ่ม ระบบจะจองช่องเวลาที่ติดกันให้": "If you have several topics or many documents, tap the plus sign to ask for more time. The system books back-to-back slots for you.", "ช่องสีขาวคือเวลาที่ว่าง ช่องสีเทาที่มีขีดฆ่าคือมีคนจองแล้ว กดเวลาที่ต้องการ 1 ช่อง": "White slots are free; grey crossed-out slots are taken. Tap one time slot.", "ปุ่ม \"ถัดไป\"": "The \"Next\" button", "กดเพื่อไปขั้นที่ 2 กรอกหัวข้อ แผนก ประเภทเรื่อง รายละเอียด และแนบไฟล์ จากนั้นขั้นที่ 3 ตรวจสอบแล้วกด \"ยืนยันการจอง\"": "Go to step 2 to enter the subject, department, request type and details and attach files. In step 3, check everything and press \"Confirm booking\".", "จองแล้วบัตรคิวจะอยู่ตรงนี้ บอกเลขคิว วันเวลา และสถานะ กดที่บัตรเพื่อดูประวัติทุกขั้นพร้อมวันเวลา แชทกับเลขา ขอเลื่อนนัด หรือขอยกเลิก": "After booking, your queue ticket shows here with its number, date, time and status. Tap it to see every step with timestamps, chat with the secretary, or ask to reschedule or cancel.", "เมนู \"ประวัติ\"": "The \"History\" menu", "เรื่องที่จบแล้วและผลการเซ็นย้อนหลังอยู่ที่นี่ เรื่องที่ถูกตีกลับ เปิดแล้วกด \"จองรอบใหม่\" ได้โดยไม่ต้องกรอกซ้ำ": "Finished requests and past signing results live here. For a returned request, open it and press \"Book another round\" — no need to fill it in again.", "ระบบแจ้งเมื่อเลขายืนยันคิว เมื่อใกล้ถึงคิว และเมื่อมีผลการเซ็น ตัวเลขสีแดงคือจำนวนเรื่องที่ยังไม่ได้อ่าน": "You are notified when the secretary confirms your queue, when your turn is close, and when there is a signing result. The red number is how many are unread.", "ปุ่ม \"เมนู\"": "The \"Menu\" button", "เปิดบทเรียนนี้ซ้ำได้ที่ \"วิธีใช้งาน\" และออกจากระบบได้จากเมนูนี้": "Replay this tour from \"How to use\", and sign out from this menu.", "สรุปสั้นๆ คือ กด \"จองคิว\" เลือกวันและเวลา บอกเรื่องที่จะขอเซ็น แล้วรอแจ้งเตือนยืนยันคิว ขอบคุณที่เรียนกับยูนิคค่ะ": "In short: tap \"Book\", pick a day and time, say what needs signing, then wait for the confirmation. Thanks for learning with Unik!", "ยูนิคจะพาดูงานของเลขานุการ 3 เรื่อง คือ ตรวจคำขอ สร้างรอบเซ็น และคุมคิวในวันเซ็น ใช้เวลาประมาณ 2 นาทีค่ะ": "I'll show you the secretary's three jobs: reviewing requests, creating signing rounds, and running the queue on signing day. It takes about 2 minutes.", "ปฏิทินนัดหมาย": "Appointment calendar", "1 ช่องคือ 1 วัน แถบสีบอกสถานะคิว สีเหลืองรอพิจารณา สีฟ้ายืนยันคิวแล้ว สีเขียวเซ็นแล้ว กดวันที่เพื่อดูคิวของวันนั้น ลูกศรด้านบนใช้เปลี่ยนเดือน": "Each cell is one day. Colour bars show queue status: yellow awaiting decision, blue confirmed, green signed. Tap a date to see that day's queue; the arrows at the top change the month.", "รายการคิวของวันที่กดเลือกจะอยู่ตรงนี้ ถ้าวันนั้นมีรอบเซ็นจะมีปุ่ม \"เปิดคิวสด\" และ \"One-page Summary\" ให้กด": "The queue for the selected day appears here. If the day has a signing round you will also see \"Open live queue\" and \"One-page Summary\".", "เมนู \"กล่องนัดหมาย\"": "The \"Inbox\" menu", "คำขอใหม่ทุกเรื่องเข้ามาที่นี่ ตัวเลขสีแดงคือจำนวนเรื่องที่รอคุณตรวจ ลองกดที่เมนูได้เลยค่ะ": "Every new request arrives here. The red number is how many are waiting for your review. Try tapping the menu.", "\"รอดำเนินการ\" คือเรื่องที่ต้องทำตอนนี้ \"ขอเปลี่ยนแปลง\" คือผู้ขอขอเลื่อนหรือยกเลิก ส่วน \"จบแล้ว\" และ \"ทั้งหมด\" ใช้ค้นย้อนหลัง": "\"Pending\" is what needs action now, \"Change requested\" means the requester asked to reschedule or cancel, and \"Done\" and \"All\" are for looking back.", "กดที่รายการเพื่อเปิดคำขอ ข้างในมีเช็กลิสต์ ไฟล์แนบที่กดดูตัวอย่างได้ แชทกับผู้ขอ และปุ่ม \"ยืนยันคิว\" \"ส่งกลับให้แก้ไข\" \"ไม่รับคิว\"": "Tap an item to open the request. Inside are the checklist, attachments you can preview, chat with the requester, and the \"Confirm queue\", \"Send back for edits\" and \"Decline\" buttons.", "เมนู \"รอบเซ็น\"": "The \"Signing rounds\" menu", "ใช้กำหนดว่าผู้บริหารจะเซ็นวันไหน เวลาใด พนักงานจองได้เฉพาะรอบที่สร้างไว้ ลองกดที่เมนูค่ะ": "Set the days and times the executive will sign. Staff can only book rounds created here. Try tapping the menu.", "ปุ่ม \"สร้างรอบ\"": "The \"New round\" button", "สร้างได้ทั้งรอบเดียวและแบบทำซ้ำรายสัปดาห์ กำหนดเวลาเริ่ม เวลาสิ้นสุด และจำนวนนาทีต่อ 1 คิว": "Create a one-off or weekly repeating round and set the start time, end time and minutes per slot.", "ปุ่ม \"ปิด\" คือหยุดรับคิวเพิ่มโดยคิวเดิมยังอยู่ ปุ่ม \"เปิด\" คือกลับมารับคิว ส่วน \"ลบ\" ทำได้เฉพาะรอบที่ยังไม่มีคิว": "\"Close\" stops new bookings but keeps existing ones, \"Open\" accepts bookings again, and \"Delete\" only works for rounds with no bookings.", "เมนู \"คิวสด\"": "The \"Live queue\" menu", "หน้านี้ใช้ในวันเซ็นจริง ลองกดที่เมนูค่ะ": "Use this page on the signing day itself. Try tapping the menu.", "กด \"เรียกคิวถัดไป\" ระบบจะแจ้งผู้ขอทันที เมื่อผู้ขอมาถึงกด \"เริ่มเข้าพบ\" และเมื่อจบกด \"บันทึกผล\" เลือกเซ็นแล้ว เซ็นบางส่วน ตีกลับ หรือไม่มาตามคิว": "Press \"Call next\" and the requester is notified at once. When they arrive press \"Start meeting\", and when done press \"Record outcome\" and choose Signed, Partly signed, Returned or No-show.", "ปุ่ม \"One-page Summary\"": "The \"One-page Summary\" button", "สรุปทุกคิวของรอบไว้ในหน้าเดียวสำหรับเสนอผู้บริหาร พร้อมประเด็นที่ยังไม่ผ่านเช็กลิสต์ และดาวน์โหลดเป็น PDF ได้": "Puts every queue in the round on one page for the executive, with checklist items not yet passed, and can be downloaded as a PDF.", "เมนู \"Dashboard\"": "The \"Dashboard\" menu", "สรุปจำนวนคำขอ สัดส่วนการตีกลับ แผนกและประเภทเรื่องที่ขอมากที่สุด เลือกช่วงเวลาได้": "Shows request counts, the return rate, and the busiest departments and request types for any period you choose.", "แจ้งเมื่อมีคำขอใหม่ มีการขอเลื่อนหรือยกเลิก และมีข้อความแชทจากผู้ขอ": "Notifies you of new requests, reschedule or cancel requests, and chat messages from requesters.", "เปิดบทเรียนนี้ซ้ำได้ที่ \"วิธีใช้งาน\" เปลี่ยน PIN และออกจากระบบได้จากเมนูนี้": "Replay this tour from \"How to use\", and change your PIN or sign out from this menu.", "ลำดับงานประจำคือ สร้างรอบเซ็น ตรวจคำขอในกล่องนัดหมาย และใช้คิวสดในวันเซ็น ขอบคุณที่เรียนกับยูนิคค่ะ": "Your routine: create signing rounds, review requests in the Inbox, and use the Live queue on signing day. Thanks for learning with Unik!", "สำหรับผู้บริหารใช้เพียง 4 หน้าจอ ยูนิคขอเวลาไม่ถึง 1 นาทีพาดูค่ะ": "Executives only need 4 screens. This takes less than a minute.", "เห็นทุกรอบเซ็นและคิวของแต่ละวันในปฏิทินเดียว กดวันที่เพื่อดูรายการคิวของวันนั้นทางด้านขวา": "See every signing round and each day's queue in one calendar. Tap a date to see that day's queue on the right.", "เมนู \"คำขอทั้งหมด\"": "The \"All requests\" menu", "ดูได้ทุกคำขอ ทั้งที่เลขาตรวจแล้วและยังไม่ได้ตรวจ ลองกดที่เมนูค่ะ": "See every request, reviewed by the secretary or not. Try tapping the menu.", "\"ยังไม่ผ่านเลขา\" คือเรื่องใหม่ เปิดแล้วกด \"ข้ามเลขา (Skip)\" เพื่อพิจารณาเองได้ ส่วน \"ผ่านเลขาแล้ว\" คือเรื่องที่เลขายืนยันคิวให้แล้ว": "\"Not yet reviewed by the secretary\" are new requests — open one and press \"Skip the secretary\" to decide it yourself. \"Reviewed by the secretary\" are ones the secretary has already confirmed.", "ใช้ในวันเซ็น ลองกดที่เมนูค่ะ": "Use this on signing day. Try tapping the menu.", "เห็นว่าใครกำลังเข้าพบและใครเป็นคิวถัดไป กดที่รายการเพื่ออ่านรายละเอียด ดูไฟล์แนบ และแชทกับผู้ขอ ลูกศรขึ้นลงท้ายรายการใช้สลับลำดับคิว": "See who is in the meeting and who is next. Tap an item to read the details, view attachments and chat with the requester. The up/down arrows at the end of a row reorder the queue.", "สรุปความถี่ของคำขอ สัดส่วนการตีกลับ แผนกและประเภทเรื่องที่ขออนุมัติมากที่สุด": "Shows how often requests come in, the return rate, and the departments and request types asking for approval most.", "แจ้งเรื่องที่รอพิจารณา และสรุปงานเซ็นของแต่ละวัน": "Alerts you to items awaiting your decision and summarises each day's signing.", "เปิดบทเรียนนี้ซ้ำได้ที่ \"วิธีใช้งาน\"": "Replay this tour from \"How to use\".", "ตารางนัดหมาย คำขอทั้งหมด คิวสด และ Dashboard ขอบคุณค่ะ": "Schedule, All requests, Live queue and Dashboard. Thank you!", "ผู้ขอใช้งานที่รออนุมัติ": "Users awaiting approval", "เมื่อมีคนลงทะเบียนใหม่ รายชื่อจะขึ้นตรงนี้ กด \"อนุมัติ\" ได้ทันทีโดยไม่ต้องเข้าหน้าผู้ดูแล": "New registrations appear here. Press \"Approve\" straight away without opening the Admin page.", "หน้า \"ผู้ดูแล\"": "The \"Admin\" page", "ส่วนนี้เห็นเฉพาะผู้ดูแลระบบ บนมือถือเข้าจากปุ่ม \"เมนู\" ลองกดได้เลยค่ะ หรือกด \"ถัดไป\" ให้ยูนิคพาไป": "Only admins see this. On mobile, open it from the \"Menu\" button. Try tapping it, or press \"Next\" and I'll take you there.", "อนุมัติบัญชี กำหนดระดับ S A B ผูกเลขากับผู้บริหาร เลือกช่องทางแจ้งเตือน ปิดบัญชี และล้าง PIN ได้จากปุ่ม \"แก้ไข\" ของแต่ละคน": "Approve accounts, set level S, A or B, link secretaries to executives, choose notification channels, deactivate accounts and reset PINs with each person's \"Edit\" button.", "ปุ่ม \"ดูในมุมมองผู้อื่น\"": "The \"View as another user\" button", "เปิดหน้าจอของผู้บริหาร เลขานุการ หรือพนักงาน เพื่อตรวจว่าแต่ละระดับเห็นอะไร และเปิด \"วิธีใช้งาน\" ของระดับนั้นดูได้จากเมนู": "Open the executive, secretary or staff view to check what each level sees, and open that level's \"How to use\" from the menu.", "แท็บ \"Workflow\"": "The \"Workflow\" tab", "แผนภาพขั้นตอนทั้งระบบ บอกว่าแต่ละขั้นมีคำขอค้างกี่เรื่อง แจ้งเตือนถึงใคร ออกช่องทางไหน และเปิดปิดการส่งออกนอกแอปรายเหตุการณ์ได้": "A map of the whole process: how many requests are waiting at each step, who is notified and through which channel, with per-event switches for sending outside the app.", "แท็บ \"ตั้งค่าระบบ\"": "The \"System settings\" tab", "สลับโหมด Demo กับใช้งานจริง เชื่อม LINE และ Teams ดูโควตาอีเมลและแจ้งเตือนที่ส่งไม่สำเร็จ แก้รายการประเภทเรื่อง แผนก และเช็กลิสต์": "Switch between Demo and live mode, connect LINE and Teams, check the email quota and failed notifications, and edit request types, departments and the checklist.", "สอนใช้งาน: มาสคอต": "Tutorial mascot", "น้องยูนิค": "Unik", "กำลังเปิดหน้าถัดไป": "Opening the next page", "เริ่มใช้งาน": "Get started", "เปิดบทเรียนซ้ำได้ที่ปุ่ม เมนู แล้วเลือก วิธีใช้งาน": "Replay the tour any time: Menu → How to use", "วิธีใช้งาน": "How to use", "กลับสู่มุมมอง Admin": "Back to Admin view", "เชื่อมบัญชี LINE เพื่อรับแจ้งเตือน": "Link your LINE account for notifications", "ไม่มีการแจ้งเตือนใหม่": "No new notifications", "อ่านทั้งหมด": "Mark all as read", "ไปที่กล่องนัดหมาย": "Go to Inbox", "ยังไม่มีข้อความ": "No messages yet", "พิมพ์ข้อความ": "Type a message", "ส่งข้อความ": "Send message", "ผู้ขอ ผู้บริหาร และเลขาของผู้บริหารเห็นข้อความในห้องนี้": "The requester, the executive and the executive's secretary can see this chat.", "โหมด Demo กดทำรายการแทนผู้ใช้นั้นได้เพื่อทดลองขั้นตอน": "Demo mode: you can act as this user to try the workflow.", "ดูได้อย่างเดียว ไม่แก้ไขข้อมูล": "View only — nothing is changed", "ยังไม่มีผู้ใช้อื่น": "No other users yet", "ทำโดยผู้ดูแล": "done by the admin", "คิวก่อนหน้า": "Previous queue", "ยกเลิกคิว": "Cancel queue", "มุมมองนี้ดูได้อย่างเดียว": "This view is read-only", "เรียกคิวแล้ว": "Called", "ผู้บริหารข้ามขั้นเลขา": "Executive skipped the secretary", "ไม่อนุมัติการเปลี่ยนแปลง": "Reject the change", "อนุมัติการเปลี่ยนแปลง": "Approve the change", "กำลังโหลดรายละเอียด…": "Loading details…", "สิ่งที่ต้องแก้ไข": "What to fix", "ต้องทำต่อ": "Follow-up", "บันทึกจากเลขา": "Secretary's note", "ยังไม่ผ่านเช็กลิสต์": "Checklist not passed", "ติดต่อผู้ขอ": "Contact the requester", "เก็บเป็นดราฟ": "Saved as draft", "ผู้ขอ ผู้บริหาร": "Requester, executive", "คำขอนี้ถูกตรวจหรือถูกเห็นแล้ว ต้องรออนุมัติ": "This request has already been reviewed or seen, so it needs approval.", "บันทึกถึงผู้บริหาร (ผู้ขอไม่เห็น)": "Note to the executive (hidden from the requester)", "สิ่งที่ต้องการให้แก้ไข": "What should be changed", "เหตุผลหรือประเด็น (จำเป็นเมื่อตีกลับหรือเซ็นบางส่วน)": "Reason or issues (required when returned or partly signed)", "ยังไม่มีรอบอื่นที่เปิดรับคิว": "No other round is open for booking", "เลือกวันและเวลาใหม่ แล้วรอเลขาอนุมัติ": "Choose a new date and t บบ": "Too many attempts that did not match. Try again in 1 hour or contact the admin", "รหัสพนักงานนี้ถูกล็อกชั่วคราวเพราะกรอกผิดหลายครั้ง กรุณาติดต่อผู้ดูแลระบบ": "This employee ID is temporarily locked after too many wrong attempts. Please contact the admin", "กรุณากรอกเบอร์โทรให้ครบ": "Please enter the full phone number", "รหัสพนักงานนี้มีผู้ลงทะเบียนไว้แล้ว ระบบแจ้งผู้ดูแลแล้ว หากเป็นของคุณกรุณาติดต่อผู้ดูแลระบบ": "This employee ID is already registered. The admin has been told. If it is yours, please contact the admin", "รหัสพนักงานนี้มีผู้ลงทะเบียนไว้แล้ว หากเป็นของคุณกรุณาติดต่อผู้ดูแลระบบ": "This employee ID is already registered. If it is yours, please contact the admin", "หมดเวลายืนยัน กรุณากรอกรหัสพนักงานและเบอร์โทรอีกครั้ง": "Confirmation timed out. Please enter your employee ID and phone number again", "ไม่พบรหัสพนักงานนี้ในทะเบียนแล้ว กรุณาติดต่อผู้ดูแลระบบ": "This employee ID is no longer in the register. Please contact the admin", "บัญชีนี้ยืนยันตัวตนเรียบร้อยแล้ว": "This account is already verified", "กรุณายืนยันด้วยรหัสพนักงานและเบอร์โทรในหน้าลงทะเบียน": "Please verify with your employee ID and phone number on the registration page", "ปิดบัญชีของตัวเองไม่ได้": "You cannot disable your own account", "ลงทะเบียนด้วยรหัสพนักงาน": "Registered with employee ID", "รหัสพนักงานถูกล็อกชั่วคราว": "Employee ID temporarily locked", "มีผู้ลงทะเบียนซ้ำด้วยรหัสพนักงาน": "Duplicate registration attempt with an employee ID", "ล้างรหัสพนักงานจากคำขอที่ค้างอยู่": "Employee ID removed from a pending request", "นำเข้าทะเบียนพนักงานแล้ว": "Employee register imported", "ใช้งานได้ทันทีเพราะรหัสและเบอร์ตรงทะเบียน HR": "active right away because the ID and phone match HR", "กรุณาโทรยืนยันก่อนอนุมัติ": "please call to confirm before approving", "ตั้งเมนูตามสถานะลงทะเบียน": "Set menus by registration status", "ตั้งเมนู LINE ตามสถานะลงทะเบียน?": "Set LINE menus by registration status?", "คนที่ยังไม่ลงทะเบียนหรือรออนุมัติจะเห็นเมนูปุ่มลงทะเบียนปุ่มเดียว บัญชีที่ใช้งานได้จะเห็นเมนูจองคิวเหมือนเดิม มีผลกับทุกคนที่เพิ่มเพื่อน LINE ของระบบ": "People who have not registered or are awaiting approval will see a menu with a single Register button. Active accounts keep the booking menu. This applies to everyone who has added the system LINE account.", "ตั้งเมนู": "Set menus", "กำลังตั้งเมนู…": "Setting menus…", "ตั้งเมนู LINE แล้ว": "LINE menus set", "แยกเมนูตามสถานะแล้ว (ยังไม่ลงทะเบียนเห็นปุ่มลงทะเบียน)": "Menus split by status (unregistered users see Register)", "ยังไม่ได้แยกเมนูตามสถานะลงทะเบียน": "Menus not yet split by registration status", "ตั้งเมนูแล้ว: เมนูเริ่มต้นเป็นปุ่มลงทะเบียน": "Menus set: the default menu is the Register button", "ระบบจะผูกให้อีกครั้งเมื่อคนนั้นเข้าสู่ระบบด้วย LINE": "it will be linked again when that person signs in with LINE", "ระบบยังไม่รู้ URL ของเว็บแอป กรุณาเปิดเว็บแอปจากลิงก์จริง 1 ครั้งก่อน": "The system does not know the web app URL yet. Open the web app from the live link once first", "ไม่พบเมนูจองคิวเดิม กรุณาตั้งเมนูจองคิวเป็นเมนูเริ่มต้นใน LINE Official Account Manager ก่อน แล้วกดอีกครั้ง": "The booking menu was not found. Set it as the default menu in LINE Official Account Manager first, then try again", "เปิดปุ่มอนุมัติในแชท LINE": "Enable approve buttons in LINE chat", "เปิดปุ่มอนุมัติในแชท LINE?": "Enable approve buttons in LINE chat?", "ระบบจะตั้ง Webhook ของ LINE ให้ส่งการกดปุ่มมาที่เว็บแอปนี้ แล้วทดสอบการเชื่อมต่อ ถ้าผ่าน การ์ดที่ต้องอนุมัติจะกดในแชทได้เลย ถ้าไม่ผ่าน ปุ่มในการ์ดจะเปิดระบบในเบราว์เซอร์เหมือนเดิม": "The system will point the LINE webhook to this web app and test the connection. If it passes, approval cards can be approved right in the chat. If not, card buttons keep opening the system in the browser.", "ตั้งค่า": "Set up", "กำลังตั้งค่า…": "Setting up…", "ตั้งที่อยู่ Webhook แล้ว แต่ Webhook ของ LINE ยังปิดอยู่ กรุณาเปิด Use webhook ใน LINE Developers หรือเปิด Webhook ใน LINE Official Account Manager แล้วกดปุ่มนี้อีกครั้ง": "The webhook URL is set but the LINE webhook is still off. Turn on Use webhook in LINE Developers, or Webhook in LINE Official Account Manager, then press this button again", "เปิดปุ่มอนุมัติในแชทแล้ว": "Approve buttons in chat are on", "ยังไม่ได้เปิดปุ่มอนุมัติในแชท": "Approve buttons in chat are not on yet", "ปุ่มอนุมัติในแชท: เปิดแล้ว": "Approve in chat: on", "ปุ่มอนุมัติในแชท: Webhook เปิดแล้ว แต่ยังไม่ได้ทดสอบ": "Approve in chat: webhook on but not tested yet", "ปุ่มอนุมัติในแชท: ยังไม่เปิด (ปุ่มในการ์ดเปิดระบบในเบราว์เซอร์)": "Approve in chat: off (card buttons open the system in the browser)", "คุณเป็นคิวแรก": "You are first in line", "บัญชีนี้ไม่มีสิทธิ์ทำรายการนี้": "This account cannot do this", "โหมด Demo ส่งประกาศถึงผู้ดูแลเท่านั้น": "Demo mode: announcement sent to admins only", "ประกาศทาง LINE ถึงทุกคนแล้ว": "Announced to everyone on LINE", "ประกาศทาง LINE ยังไม่สำเร็จ ระบบจะลองใหม่เอง": "LINE announcement not sent yet — the system will retry", "ประกาศรอบเซ็นใหม่ทาง LINE ไม่สำเร็จ": "New round announcement on LINE failed", "โควตา LINE เดือนนี้หมดแล้ว": "This month's LINE quota is used up", "LINE จำกัดจำนวนครั้งที่ส่ง กรุณาลองใหม่ภายหลัง": "LINE rate limit reached — please try again later", "Channel access token ใช้ไม่ได้": "The channel access token is not valid", "เกินเวลาที่ลองใหม่ได้": "Retry window expired", "เปิดรอบเซ็นเอกสารใหม่": "New signing round open", "เปิดรับจองคิวแล้ว": "Now open for booking", "ระบบของ Google ตอบช้าชั่วคราว กรุณาลองใหม่อีกครั้ง": "Google services are temporarily slow — please try again", "รายการนี้ถูกแก้ไขในชีตระหว่างทำรายการ กรุณาโหลดหน้าใหม่แล้วลองอีกครั้ง": "This item was changed in the sheet while you were working. Please reload and try again.", "ล้างแคชข้อมูล": "Clear data cache", "แก้ข้อมูลในชีตด้วยมือแล้ว ระบบจะเห็นภายใน 5 นาที กดปุ่มนี้ถ้าต้องการให้เห็นทันที": "After editing the sheet by hand, the system picks up the change within 5 minutes. Press this to apply it now.", "ล้างแคชแล้ว ระบบอ่านข้อมูลจากชีตใหม่": "Cache cleared — data will be read from the sheet again", "งานค้างอยู่ขั้นไหน และใครต้องทำต่อ": "Where work is waiting, and who acts next", "ช่องทางแจ้งเตือนและกติการายเหตุการณ์": "Notification channels and per-event rules", "ระบบอยู่ในโหมด Demo ตัวเลขนับเฉพาะคำขอจริง ไม่นับข้อมูลตัวอย่าง": "Demo mode: counts include real requests only, not sample data", "เส้นทางหลักของคำขอ": "Main request path", "อ่านจากซ้ายไปขวา ตัวเลขใหญ่คือเรื่องที่ค้างอยู่ในขั้นนั้นตอนนี้ ป้ายสีบอกว่าใครต้องทำต่อ ขอบแดงคือมีเรื่องรอเกิน 1 วันทำการ กดการ์ดเพื่อดูรายการ": "Read left to right. The big number is what is waiting at that step now, the colored tag shows who acts next, and a red border means something has waited more than 1 working day. Tap a card to see the list.", "เรื่องที่ต้องตัดสินใจ (นอกเส้นทางหลัก)": "Decisions outside the main path", "กดการ์ดเพื่อเปิดรายการแล้วจัดการได้ทันที": "Tap a card to open the list and act on it right away", "ขั้นตอนการทำงาน": "How the process works", "ผู้ขอจองคิว เลือกประเภท: คิวปกติ / คิวด่วน / บันทึกย้อนหลัง / ฝากเซ็น": "The requester books a queue and picks a type: normal / urgent / retroactive record / drop-off", "เลขาตรวจคำขอ: ยืนยันคิว หรือขอข้อมูลเพิ่ม (ผู้ขอแก้แล้วกลับมาที่ขั้นนี้) ถ้าเลขายังไม่ตรวจ ผู้บริหารพิจารณาเองได้": "The secretary reviews: confirm the queue or ask for more information (it comes back to this step after the requester edits). If the secretary has not reviewed yet, the executive can decide directly.", "ระบบเตือนผู้ขอก่อนวันนัด 1 วันและเช้าวันนัด และส่งสรุปถึงผู้บริหารกับเลขาทุกเช้า 07:00 น.": "The system reminds the requester 1 day before and on the morning of the appointment, and sends a summary to the executive and secretary every morning at 07:00.", "วันเซ็น เลขาเรียกคิวจากหน้าคิวสด แล้วบันทึกผล: เซ็นแล้ว / เซ็นบางส่วน / ตีกลับ / ไม่มา": "On signing day the secretary calls queues from the Live queue page and records the result: signed / partly signed / returned / no-show", "ขอเลื่อนหรือยกเลิกได้ระหว่างทาง เลขาหรือผู้บริหารเป็นผู้อนุมัติ": "Reschedule or cancel requests can be made along the way; the secretary or executive approves them", "ช่องทางแจ้งเตือนและกติการายเหตุการณ์อยู่ที่แท็บ \"การแจ้งเตือน\"": "Notification channels and per-event rules are on the \"Notifications\" tab", "เปิดแท็บการแจ้งเตือน": "Open the Notifications tab", "รอเลขาตรวจ": "Waiting for secretary review", "คำขอใหม่": "New requests", "เลขาต้องทำ": "Secretary acts", "รอผู้ขอแก้ไข": "Waiting for requester to edit", "ผู้ขอต้องทำ": "Requester acts", "วันเซ็น": "Signing day", "เรียกคิว / กำลังเข้าพบ": "Called / in meeting", "ผู้บริหาร / เลขา": "Executive / secretary", "ปิดเรื่อง": "Closed", "ของฝากในตะกร้า": "Drop-offs in the tray", "เลขาเรียกเข้ารอบ": "Secretary calls into a round", "เลขาอนุมัติ": "Secretary approves", "ขอเลื่อน / ยกเลิก": "Reschedule / cancel requests", "เลขาหรือผู้บริหารอนุมัติ": "Secretary or executive approves", "เลขายืนยัน": "Secretary confirms", "รอบถูกเลื่อน": "Round moved", "รอผู้ขอตอบ": "Waiting for requester reply", "ข้ามขั้นเลขา": "Skipped the secretary", "รอเกิน 1 วันทำการ": "Waiting over 1 working day", "ไม่มีเรื่องรอ": "Nothing waiting", "ไม่มีเรื่องค้าง": "Nothing pending", "ยังไม่มีคิวที่ยืนยัน": "No confirmed queues yet", "ไม่มีนัดที่จะถึง": "No upcoming appointments", "ไม่มีรอบวันนี้": "No round today", "เฉลี่ยส่งคำขอถึงเซ็น: ยังไม่มีข้อมูล": "Average request-to-signed time: no data yet", "เรื่องที่ปิดใน 30 วันล่าสุด": "Closed in the last 30 days", "แท็บ \"การแจ้งเตือน\"": "The \"Notifications\" tab", "งานค้างอยู่ขั้นไหน ใครต้องทำต่อ เรียงตั้งแต่ส่งคำขอจนปิดเรื่อง ขอบแดงคือเรื่องที่รอเกิน 1 วันทำการ กดการ์ดเพื่อดูรายการ": "Where work is waiting and who acts next, from request to close. A red border means something has waited more than 1 working day. Tap a card to see the list.", "ช่องทางแจ้งเตือน ยอดส่งใน 30 วัน และเปิดปิดการส่งออกนอกแอปรายเหตุการณ์": "Notification channels, sends in the last 30 days, and per-event switches for sending outside the app", "ไม่มีคิวรอก่อนคุณ": "No one is waiting ahead of you", "ส่งกลับให้แก้โดย": "Sent back for ดเสนอเซ็น": "Signing book", "แฟ้มชมพู": "Pink folder", "แฟ้มฟ้า": "Blue folder", "แฟ้มเหลือง": "Yellow folder", "แฟ้มเขียว": "Green folder", "แฟ้มส้ม": "Orange folder", "ซองเอกสารน้ำตาล": "Brown envelope", "ซองเอกสารเวียน": "Routing envelope", "พิมพ์ค้นหา หรือแตะเพื่อเลือก": "Type to search or tap to choose", "ไม่พบในรายการ เลือก อื่น ๆ แล้วพิมพ์เอง": "Not in the list. Choose Other and type it in", "ไม่พบในรายการ ลองพิมพ์คำอื่น": "Not in the list. Try another word", "ไม่พบในรายการ": "Not in the list", "หัวข้อที่เคยส่ง": "Your previous titles", "ประเภทเอกสาร (บรรทัดละ 1 รายการ: กลุ่ม | ประเภท | จำนวนเงิน ต้องกรอก/กรอกได้/- | เลขที่ มี/- | คำค้น)": "Document types (one per line: group | type | amount required/optional/- | doc no. yes/- | search words)", "ระบบพบบัญชีเดิมของคุณ": "We found your existing account", "กดยืนยันแล้วระบบจะเชื่อม LINE นี้เข้ากับบัญชีเดิม ไม่สร้างบัญชีใหม่": "Confirm to link this LINE account to it. No new account will be created.", "เชื่อม LINE กับบัญชีเดิมแล้ว": "LINE linked to your existing account", "บัญชีเดิมของคุณใช้งานผ่าน LINE ได้แล้ว ครั้งต่อไปแตะเมนู LINE ได้เลย": "Your existing account now works with LINE. Next time, just tap the LINE menu.", "บัญชีของคุณเชื่อมกับ LINE อื่นอยู่แล้ว กรุณาติดต่อผู้ดูแลระบบ": "Your account is already linked to another LINE account. Please contact the system admin.", "เชื่อม LINE กับบัญชีของคุณแล้ว": "LINE linked to your account", "เชื่อม LINE กับบัญชีเดิม": "LINE linked to an existing account", "มีผู้พยายามเชื่อม LINE กับบัญชีที่เชื่อมไว้แล้ว": "Someone tried to link LINE to an account that is already linked", "วันนี้ยูนิคจะพาดูทีละปุ่มนะคะ ว่าพนักงานจองคิวเซ็นเอกสารยังไง ใช้เวลาแค่ประมาณ 1 นาที ระหว่างนี้ยังไม่มีการส่งคำขอจริง ลองกดได้ตามสบายเลยค่ะ": "I'll walk you through booking a signing queue, one button at a time. It only takes about a minute, and nothing is sent while we practise, so feel free to tap around!", "อยากเข้าพบผู้บริหาร เริ่มจากปุ่มนี้เลยค่ะ ลองกดดูได้นะคะ หรือจะกด \"ถัดไป\" ให้ยูนิคพาไปก็ได้ค่ะ": "This is where you start booking a meeting with the executive. Go ahead and tap it, or press \"Next\" and I'll take you there.", "คิวปกติคือจองเวลาในรอบเซ็นค่ะ คิวด่วนใช้ตอนที่คุณเคนให้เข้าพบแล้ว บันทึกย้อนหลังใช้เมื่อเข้าพบไปแล้วแต่ยังไม่ได้จอง ส่วนฝากเลขาใช้ฝากเอกสารไว้โดยไม่ต้องจองเวลาค่ะ": "Normal books a time in a signing round. Urgent is for when Khun Ken has already agreed to see you. Retroactive is for a meeting that already happened without a booking. And Drop-off lets you leave documents without booking a time.", "แต่ละกล่องคือรอบเซ็นที่เปิดรับคิวอยู่ค่ะ ตัวเลขหลังคำว่า \"ว่าง\" คือจำนวนช่องที่ยังจองได้ เลือกวันที่สะดวกได้เลยนะคะ": "Each box is a signing round that's open for booking. The number after \"free\" shows how many slots are left. Just tap the day that suits you.", "ถ้ามีหลายเรื่อง หรือเอกสารเยอะ กดเครื่องหมายบวกเพื่อขอเวลาเพิ่มได้ค่ะ ระบบจะจองช่องเวลาที่ติดกันให้เลย": "Got several topics or a big stack of documents? Tap the plus sign to ask for more time, and the system will book back-to-back slots for you.", "ช่องสีขาวคือเวลาที่ยังว่างค่ะ ช่องสีเทาที่มีขีดฆ่าคือมีคนจองแล้ว เลือกเวลาที่ต้องการ 1 ช่องนะคะ": "White slots are free, and grey crossed-out ones are already taken. Pick one time slot that works for you.", "กดเพื่อไปขั้นที่ 2 กรอกหัวข้อ ประเภทเอกสาร โครงการ จำนวนเงิน แล้วแนบไฟล์ค่ะ จากนั้นขั้นที่ 3 ตรวจให้เรียบร้อย แล้วกด \"ยืนยันการจอง\" ได้เลย": "Tap here for step 2, where you add the subject, document type, project and amount, and attach files. Then check everything in step 3 and press \"Confirm booking\".", "จองเสร็จแล้ว บัตรคิวจะอยู่ตรงนี้ค่ะ บอกเลขคิว วันเวลา และสถานะ กดที่บัตรเพื่อดูทุกขั้นพร้อมเวลา แชทกับเลขา ขอเลื่อนนัด หรือขอยกเลิกได้นะคะ": "Once you've booked, your queue ticket shows up here with its number, date, time and status. Tap it to see every step with times, chat with the secretary, or ask to reschedule or cancel.", "เรื่องที่จบแล้วและผลการเซ็นย้อนหลังอยู่ที่นี่ค่ะ ถ้าเรื่องไหนถูกตีกลับ เปิดแล้วกด \"จองรอบใหม่\" ได้เลย ไม่ต้องกรอกซ้ำค่ะ": "Finished requests and past signing results are kept here. If a request was returned, just open it and press \"Book another round\", no need to fill it in again.", "ระบบจะแจ้งตรงนี้เมื่อเลขายืนยันคิว เมื่อใกล้ถึงคิว และเมื่อมีผลการเซ็นค่ะ ตัวเลขสีแดงคือเรื่องที่ยังไม่ได้อ่าน": "You'll be notified here when the secretary confirms your queue, when your turn is coming up, and when there's a signing result. The red number shows how many you haven't read yet.", "อยากดูบทเรียนนี้อีกครั้ง เลือก \"วิธีใช้งาน\" ได้เลยค่ะ ออกจากระบบก็อยู่ในเมนูนี้นะคะ": "Want to see this tour again? Just choose \"How to use\". You can sign out from this menu too.", "สรุปง่าย ๆ นะคะ กด \"จองคิว\" เลือกวันและเวลา บอกเรื่องที่จะขอเซ็น แล้วรอแจ้งเตือนยืนยันคิว ขอบคุณที่มาเรียนกับยูนิคนะคะ": "Quick recap: tap \"Book\", pick a day and time, tell us what needs signing, then wait for your confirmation. Thanks for learning with me!", "วันนี้ยูนิคจะพาดูงานหลักของเลขานุการ 3 เรื่องค่ะ ตรวจคำขอ สร้างรอบเซ็น และดูแลคิวในวันเซ็น ใช้เวลาประมาณ 2 นาทีนะคะ": "I'll show you the secretary's three main jobs: reviewing requests, creating signing rounds, and running the queue on signing day. It takes about 2 minutes.", "1 ช่องคือ 1 วันค่ะ แถบสีบอกสถานะคิว สีเหลืองรอพิจารณา สีฟ้ายืนยันคิวแล้ว สีเขียวเซ็นแล้ว กดที่วันเพื่อดูคิวของวันนั้น ส่วนลูกศรด้านบนใช้เปลี่ยนเดือนค่ะ": "Each cell is one day, and the colour bars show queue status: yellow is waiting for a decision, blue is confirmed, and green is signed. Tap a date to see that day's queue, and use the arrows at the top to change the month.", "คิวของวันที่เลือกจะขึ้นตรงนี้ค่ะ ถ้าวันนั้นมีรอบเซ็น จะมีปุ่ม \"เปิดคิวสด\" และ \"One-page Summary\" ให้กดด้วยนะคะ": "The queue for the day you pick shows up here. If there's a signing round that day, you'll also see \"Open live queue\" and \"One-page Summary\".", "คำขอใหม่ทุกเรื่องจะเข้ามาที่นี่ค่ะ ตัวเลขสีแดงคือเรื่องที่รอคุณตรวจ ลองกดที่เมนูดูได้เลยนะคะ": "Every new request lands here, and the red number shows how many are waiting for your review. Go ahead and tap the menu.", "\"รอดำเนินการ\" คือเรื่องที่ต้องทำตอนนี้ค่ะ \"ขอเปลี่ยนแปลง\" คือผู้ขออยากเลื่อนหรือยกเลิก ส่วน \"จบแล้ว\" กับ \"ทั้งหมด\" ไว้ค้นย้อนหลังค่ะ": "\"Pending\" is what needs your attention now, \"Change requested\" means someone wants to reschedule or cancel, and \"Done\" and \"All\" are for looking back.", "กดที่รายการเพื่อเปิดคำขอได้เลยค่ะ ข้างในมีเช็กลิสต์ ไฟล์แนบที่กดดูตัวอย่างได้ แชทกับผู้ขอ และปุ่ม \"ยืนยันคิว\" \"ส่งกลับให้แก้ไข\" \"ไม่รับคิว\"": "Tap an item to open the request. Inside you'll find the checklist, attachments you can preview, a chat with the requester, and the \"Confirm queue\", \"Send back for edits\" and \"Decline\" buttons.", "ที่นี่ใช้กำหนดว่าผู้บริหารจะเซ็นวันไหน เวลาใดค่ะ พนักงานจะจองได้เฉพาะรอบที่สร้างไว้ ลองกดที่เมนูดูนะคะ": "This is where you set the days and times the executive will sign. Staff can only book rounds you create here. Give the menu a tap.", "สร้างได้ทั้งรอบเดียว และแบบทำซ้ำทุกสัปดาห์ค่ะ กำหนดเวลาเริ่ม เวลาสิ้นสุด และจำนวนนาทีต่อ 1 คิวได้เลย": "Create a one-off round or a weekly repeating one, and set the start time, end time and minutes per slot.", "ปุ่ม \"ปิด\" คือหยุดรับคิวเพิ่ม แต่คิวเดิมยังอยู่ค่ะ ปุ่ม \"เปิด\" คือกลับมารับคิวต่อ ส่วน \"ลบ\" ทำได้เฉพาะรอบที่ยังไม่มีคิวนะคะ": "\"Close\" stops new bookings but keeps the existing ones, \"Open\" starts taking bookings again, and \"Delete\" only works for rounds with no bookings yet.", "หน้านี้ใช้ในวันเซ็นจริงค่ะ ลองกดที่เมนูดูนะคะ": "You'll use this page on the signing day itself. Give the menu a tap.", "กด \"เรียกคิวถัดไป\" ระบบจะแจ้งผู้ขอทันทีค่ะ ผู้ขอมาถึงแล้วกด \"เริ่มเข้าพบ\" พอเสร็จกด \"บันทึกผล\" แล้วเลือก เซ็นแล้ว เซ็นบางส่วน ตีกลับ หรือไม่มาตามคิว": "Press \"Call next\" and the requester is notified right away. When they arrive, press \"Start meeting\", and when you're done, press \"Record outcome\" and choose Signed, Partly signed, Returned or No-show.", "สรุปทุกคิวของรอบไว้ในหน้าเดียว สำหรับเสนอผู้บริหารค่ะ มีประเด็นที่ยังไม่ผ่านเช็กลิสต์ให้ด้วย และดาวน์โหลดเป็น PDF ได้นะคะ": "This puts every queue in the round on one page for the executive, flags checklist items that haven't passed yet, and can be downloaded as a PDF.", "เอกสารที่พนักงานฝากไว้จะรออยู่ที่นี่ค่ะ ติ๊กเลือกหลายรายการ แล้วกดเรียกเข้ารอบได้ในครั้งเดียว ระบบจองเวลาท้ายรอบให้ รายการละ 5 นาทีค่ะ": "Documents that staff drop off wait here. Tick several and call them into a round in one go. The system books time at the end of the round, 5 minutes per item.", "สรุปจำนวนคำขอ สัดส่วนการตีกลับ แผนกและประเภทเรื่องที่ขอมากที่สุดค่ะ เลือกช่วงเวลาที่อยากดูได้เลย": "See request counts, the return rate, and the busiest departments and request types for any period you like.", "ระบบจะแจ้งตรงนี้เมื่อมีคำขอใหม่ มีคนขอเลื่อนหรือยกเลิก และมีข้อความแชทจากผู้ขอค่ะ": "You'll be notified here about new requests, reschedule or cancel requests, and chat messages from requesters.", "อยากดูบทเรียนนี้อีกครั้ง เลือก \"วิธีใช้งาน\" ได้เลยค่ะ เปลี่ยน PIN และออกจากระบบก็อยู่ในเมนูนี้นะคะ": "Want to see this tour again? Just choose \"How to use\". You can also change your PIN or sign out from this menu.", "งานประจำมี 3 อย่างค่ะ สร้างรอบเซ็น ตรวจคำขอในกล่องนัดหมาย และใช้คิวสดในวันเซ็น ขอบคุณที่มาเรียนกับยูนิคนะคะ": "Your routine is simple: create signing rounds, review requests in the Inbox, and use the Live queue on signing day. Thanks for learning with me!", "สำหรับผู้บริหาร ใช้เพียง 4 หน้าจอค่ะ ขอเวลาไม่ถึง 1 นาที ยูนิคจะพาดูทีละหน้านะคะ": "As an executive, you only need 4 screens. Give me less than a minute and I'll show you each one.", "ทุกรอบเซ็นและคิวของแต่ละวัน อยู่ในปฏิทินเดียวค่ะ กดที่วันเพื่อดูรายการคิวของวันนั้นทางด้านขวาได้เลย": "Every signing round and each day's queue are in one calendar. Tap a date to see that day's queue on the right.", "ดูได้ทุกคำขอค่ะ ทั้งที่เลขาตรวจแล้วและยังไม่ได้ตรวจ ลองกดที่เมนูดูนะคะ": "Here you can see every request, whether the secretary has reviewed it or not. Give the menu a tap.", "\"ยังไม่ผ่านเลขา\" คือเรื่องใหม่ค่ะ เปิดแล้วกด \"ข้ามเลขา (Skip)\" เพื่อพิจารณาเองได้ ส่วน \"ผ่านเลขาแล้ว\" คือเรื่องที่เลขายืนยันคิวให้แล้วค่ะ": "\"Not yet reviewed by the secretary\" are new requests. Open one and press \"Skip the secretary\" to decide it yourself. \"Reviewed by the secretary\" are ones the secretary has already confirmed.", "หน้านี้ใช้ในวันเซ็นค่ะ ลองกดที่เมนูดูนะคะ": "You'll use this on signing day. Give the menu a tap.", "ดูได้ว่าใครกำลังเข้าพบ และใครเป็นคิวถัดไปค่ะ กดที่รายการเพื่ออ่านรายละเอียด ดูไฟล์แนบ และแชทกับผู้ขอ ส่วนลูกศรขึ้นลงท้ายรายการใช้สลับลำดับคิวค่ะ": "See who's in the meeting now and who's next. Tap an item to read the details, view attachments and chat with the requester, and use the up and down arrows at the end of a row to reorder the queue.", "สรุปความถี่ของคำขอ สัดส่วนการตีกลับ แผนกและประเภทเรื่องที่ขออนุมัติมากที่สุดค่ะ": "See how often requests come in, the return rate, and which departments and request types ask for approval most.", "ระบบจะแจ้งเรื่องที่รอพิจารณา และสรุปงานเซ็นของแต่ละวันไว้ตรงนี้ค่ะ": "You'll be notified here about items awaiting your decision, along with each day's signing summary.", "อยากดูบทเรียนนี้อีกครั้ง เลือก \"วิธีใช้งาน\" ได้เลยค่ะ": "Want to see this tour again? Just choose \"How to use\".", "มีแค่ ตารางนัดหมาย คำขอทั้งหมด คิวสด และ Dashboard ค่ะ ขอบคุณที่สละเวลานะคะ": "That's it: Schedule, All requests, Live queue and Dashboard. Thank you for your time!", "เมื่อมีคนลงทะเบียนใหม่ รายชื่อจะขึ้นตรงนี้ค่ะ กด \"อนุมัติ\" ได้ทันที ไม่ต้องเข้าหน้าผู้ดูแลเลย": "When someone registers, they show up here. You can press \"Approve\" right away without opening the Admin page.", "ส่วนนี้เห็นเฉพาะผู้ดูแลระบบค่ะ บนมือถือเข้าจากปุ่ม \"เมนู\" ลองกดดูได้เลยนะคะ หรือกด \"ถัดไป\" ให้ยูนิคพาไปก็ได้ค่ะ": "Only admins can see this. On mobile, open it from the \"Menu\" button. Go ahead and tap it, or press \"Next\" and I'll take you there.", "อนุมัติบัญชี กำหนดระดับ S A B ผูกเลขากับผู้บริหาร เลือกช่องทางแจ้งเตือน ปิดบัญชี และล้าง PIN ได้จากปุ่ม \"แก้ไข\" ของแต่ละคนค่ะ": "Approve accounts, set level S, A or B, link secretaries to executives, choose notification channels, deactivate accounts and reset PINs, all from each person's \"Edit\" button.", "เปิดดูหน้าจอแบบผู้บริหาร เลขานุการ หรือพนักงาน เพื่อเช็กว่าแต่ละระดับเห็นอะไรค่ะ และเปิด \"วิธีใช้งาน\" ของระดับนั้นจากเมนูได้ด้วยนะคะ": "Open the executive, secretary or staff view to check what each level sees. You can also open that level's \"How to use\" from the menu.", "ดูได้ว่างานค้างอยู่ขั้นไหน และใครต้องทำต่อ เรียงตั้งแต่ส่งคำขอจนปิดเรื่องค่ะ ขอบแดงคือเรื่องที่รอเกิน 1 วันทำการ กดการ์ดเพื่อดูรายการได้เลย": "See where work is waiting and who acts next, from request to close. A red border means something has waited more than 1 working day. Tap a card to see the list.", "ดูช่องทางแจ้งเตือน ยอดส่งใน 30 วัน และเปิดปิดการส่งออกนอกแอปของแต่ละเหตุการณ์ได้ที่นี่ค่ะ": "Here you'll find notification channels, sends in the last 30 days, and switches for sending each event outside the app.", "สลับโหมด Demo กับใช้งานจริง เชื่อม LINE และ Teams ดูโควตาอีเมลและแจ้งเตือนที่ส่งไม่สำเร็จ และแก้รายการประเภทเรื่อง แผนก และเช็กลิสต์ได้ที่นี่ค่ะ": "Switch between Demo and live mode, connect LINE and Teams, check the email quota and failed notifications, and edit request types, departments and the checklist.", "บันทึกผลหลังวันนัด": "Record outcome after the date", "เลยวันนัด": "Overdue", "เลยวันนัดแล้ว:": "Past the appointment date:", "วันนัด": "Appointment date", "ยังไม่ได้บันทึกผล กดปุ่มบันทึกผลด้านล่างเพื่อปิดเรื่อง": "No outcome has been recorded. Use the record button below to close it.", "ยังไม่ได้ยืนยันคิวและวันนัดผ่านไปแล้ว กดไม่รับคิวพร้อมแจ้งให้ผู้ขอจองรอบใหม่": "The queue was not confirmed and the date has passed. Decline it and ask the requester to book a new round.", "วันนัดผ่านไปแล้วโดยยังไม่ได้ยืนยันคิว รอเลขาแจ้งผล": "The date passed before the queue was confirmed. Waiting for the secretary.", "วันนัดผ่านไปแล้ว รอเลขาบันทึกผล ถ้ายังไม่ได้เข้าพบ กดขอเลื่อนนัดได้": "The date has passed. Waiting for the secretary to record the outcome. If you did not meet, you can request a new time.", "วันนัดผ่านไปแล้ว รอเลขาบันทึกผล": "Date passed · waiting for the secretary to record the outcome", "วันนัดผ่านไปแล้ว ยังไม่ได้ยืนยันคิว": "Date passed · queue not confirmed", "วันนัดผ่านไปแล้ว ระบบจะบันทึกผลโดยไม่เรียกคิว และแจ้งผลให้ผู้ขอทราบ": "The date has passed. The outcome is recorded without calling the queue, and the requester is notified.", "รอบนี้ผ่านไปแล้ว เปิดคำขอแล้วกด “บันทึกผลหลังวันนัด”": "This round has passed. Open the request and use “Record outcome after the date”.", "รอบนี้ผ่านไปแล้ว คิวที่ยังไม่ได้บันทึกผล ให้เปิดคำขอแล้วกดบันทึกผลหลังวันนัด": "This round has passed. For a queue without an outcome, open the request and record the outcome after the date.", "วันใหม่ที่ขอผ่านไปแล้ว กรุณากดไม่อนุมัติ แล้วให้ผู้ขอเลือกวันใหม่": "The requested new date has passed. Please deny it and ask the requester to choose another date.", "วันใหม่ที่ขอผ่านไปแล้ว กดไม่อนุมัติ แล้วให้ผู้ขอเลือกวันใหม่": "The requested new date has passed. Deny it and ask the requester to choose another date.", "ระบบจองคิวย้ายไปลิงก์ใหม่แล้ว": "The queue system has moved to a new link", "เปิดลิงก์ใหม่": "Open the new link", "กำลังเปิดระบบ…": "Opening…", "เชื่อมต่อ LINE ไม่สำเร็จ กรุณาลองใหม่": "Could not connect to LINE. Please try again.", "เชื่อมบัญชี LINE ไม่สำเร็จ": "Could not link the LINE account", "ลิงก์ระบบ:": "System link:", "ลิงก์สำหรับ LINE (LIFF):": "Link for LINE (LIFF):", "ยืนยันตัวตนกับ LINE ไม่สำเร็จ กรุณาปิดหน้านี้แล้วเปิดใหม่จากเมนูใน LINE": "Could not verify you with LINE. Close this page and open it again from the LINE menu.", "ระบบยังไม่ได้ตั้งค่าการเข้าสู่ระบบด้วย LINE": "LINE sign-in is not set up yet", "คำขอไม่ถูกต้อง": "Invalid request", "ติดต่อเลขา": "Contact secretary", "เลขาตอบกลับ": "Reply from the secretary", "ข้อความจากปุ่มติดต่อเลขาใน LINE": "Messages from the LINE \"Contact secretary\" button", "เลขาตอบข้อความจากปุ่มติดต่อเลขา": "Secretary replies to \"Contact secretary\" messages", "จาก": "From", "เรื่องทั่วไป": "General", "เปิดอ่านและตอบกลับ": "Read and reply", "ตอบกลับเลขา": "Reply to secretary", "ดูคำขอ": "View request", "พิมพ์ข้อความถึงเลขาได้เลย": "Type your message to the secretary", "เกี่ยวกับคำขอ": "About request", "ข้อความที่ส่งภายใน 30 นาทีจะถึงเลขาโดยตรง ไม่ส่งถึงผู้บริหาร เลขาจะตอบกลับทาง LINE นี้": "Messages you send in the next 30 minutes go straight to the secretary, not the executive. The secretary will reply here on LINE.", "ถ้าเกี่ยวกับคำขอ แตะเลือกเรื่องด้านล่างก่อนพิมพ์": "If it is about a request, tap it below before typing.", "เลือกผู้บริหารที่ต้องการติดต่อเลขา": "Choose the executive whose secretary you want to contact.", "ติดต่อเลขาของ": "Contact the secretary of", "เรื่องอื่น": "Something else", "ตอนนี้ยังไม่มีเลขาในระบบ จึงส่งข้อความถึงเลขาไม่ได้": "There is no secretary in the system yet, so the message cannot be sent.", "บัญชีของคุณยังใช้งานไม่ได้ (รออนุมัติหรือยังลงทะเบียนไม่เสร็จ) จึงยังส่งข้อความถึงเลขาไม่ได้": "Your account is not active yet (awaiting approval or registration not finished), so you cannot message the secretary yet.", "บัญชี LINE นี้ยังไม่ได้ลงทะเบียน กดปุ่ม \"ลงทะเบียน\" ในเมนูด้านล่างก่อน แล้วจึงติดต่อเลขาได้": "This LINE account is not registered. Tap \"ลงทะเบียน\" (Register) in the menu below first, then you can contact the secretary.", "ข้อความในแชทนี้ไม่ส่งต่อถึงใคร ข้อความจากพนักงานอยู่ที่หน้า \"ข้อความจากพนักงาน\" ในระบบ": "Messages in this chat are not forwarded. Employee messages are on the \"Employee messages\" page in the system.", "ข้อความในแชทนี้ยังไม่ส่งถึงเลขา ถ้าต้องการติดต่อเลขา กดปุ่ม \"ติดต่อเลขา\" ด้านล่าง": "Messages in this chat do not reach the secretary yet. To contact the secretary, tap \"Contact secretary\" below.", "ตอนนี้ส่งถึงเลขาได้เฉพาะข้อความ ถ้าต้องส่งรูปหรือไฟล์ ให้แนบในคำขอผ่านระบบ": "Only text can be sent to the secretary for now. To send a photo or file, attach it to the request in the system.", "ส่งถึงเลขาแล้ว เลขาจะตอบกลับทาง LINE นี้": "Sent to the secretary. They will reply here on LINE.", "ส่งต่อถึงเลขาแล้ว": "Forwarded to the secretary", "ส่งข้อความไม่สำเร็จ กรุณาลองใหม่อีกครั้ง": "The message could not be sent. Please try again.", "ไม่พบผู้บริหารท่านนี้แล้ว": "This executive is no longer available", "ไม่พบคำขอนี้แล้ว": "This request no longer exists", "ขณะนี้มีผู้ใช้งานหนาแน่น กรุณาส่งข้อความอีกครั้ง": "The system is busy. Please send the message again.", "ไม่พบข้อความจากผู้ใช้นี้": "No messages from this user", "บัญชีของผู้ใช้นี้ใช้งานไม่ได้แล้ว จึงส่งข้อความไม่ได้": "This user account is no longer active, so the message cannot be sent.", "ข้อความจากพนักงาน": "Employee messages", "ข้อความที่ส่งผ่านปุ่ม “ติดต่อเลขา” ใน LINE": "Sent with the “Contact secretary” button in LINE", "พนักงานส่งผ่านปุ่ม “ติดต่อเลขา” ใน LINE": "Sent by employees with the “Contact secretary” button in LINE", "ตอบที่นี่แล้วระบบส่งเข้า LINE ของพนักงาน": "Replies here go to the employee on LINE", "ยังไม่มีข้อความจากพนักงาน": "No employee messages yet", "เมื่อพนักงานกดปุ่ม “ติดต่อเลขา” ใน LINE แล้วพิมพ์ข้อความ ข้อความจะมาอยู่ที่นี่": "When an employee taps “Contact secretary” in LINE and types a message, it appears here.", "หน้านี้สำหรับเลขา": "This page is for secretaries", "ตอบแล้ว:": "Replied:", "เรื่องล่าสุด:": "Latest request:", "กลับ": "Back", "พิมพ์คำตอบ": "Type a reply", "คำตอบ": "Reply", "ส่งคำตอบ": "Send reply", "ส่งแล้วระบบส่งเข้า LINE ของพนักงาน และพนักงานพิมพ์ตอบต่อได้ภายใน 30 นาที": "Your reply goes to the employee on LINE, and they can reply back within 30 minutes.", "บัญชีนี้ยังไม่ได้ผูก LINE ระบบส่งทางอีเมลหรือในแอปแทน": "This account has no LINE link, so the reply goes by email or in the app.", "เลขาทุกคนของผู้บริหารเห็นข้อความในห้องนี้ ผู้บริหารไม่ได้รับแจ้งเตือน": "All of the executive's secretaries see this conversation. The executive is not notified.", "ข้อความที่เลือกคำขอไว้ เข้าแชทของคำขอนั้นด้วย": "Messages tied to a r  async adSeed(t){await busy(t,()=>call('adminSeedDemo'),'กำลังสร้าง…').then(r=>{toast(`สร้าง ${r.requests} รายการตัวอย่าง`);go('admin',{tab:'settings'})}).catch(()=>{})},
 async adClear(t){await busy(t,()=>call('adminClearDemo'),'กำลังล้าง…').then(()=>{toast('ล้างแล้ว');go('admin',{tab:'settings'})}).catch(()=>{})},
 async adReset(t){const v=await form({title:'Reset พร้อมใช้งานจริง',sub:'ย้อนกลับไม่ได้',ok:'ล้างข้อมูลและเริ่มใช้งานจริง',danger:true,intro:'<div class="note bad">ระบบจะลบคำขอ รอบ แชท แจ้งเตือน และบัญชีตัวอย่างทั้งหมด ไฟล์แนบจะย้ายไปถังขยะของ Drive และระบบจะเริ่มส่งแจ้งเตือนถึงผู้ใช้จริง บัญชีผู้ใช้จริงและการตั้งค่ายังอยู่</div>',fields:[{name:'confirm',label:'พิมพ์ RESET เพื่อยืนยัน',required:true}]});if(!v)return;await busy(t,()=>call('adminResetLive',{confirm:v.confirm}),'กำลังล้างข้อมูล…').then(async()=>{toast('ล้างข้อมูลแล้ว ระบบพร้อมใช้งานจริง');S.boot=await call('bootstrap');S.me=S.boot.me;S.real=S.boot.me;renderShell();go('admin',{tab:'settings'})}).catch(()=>{})}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-do]');if(t&&!t.disabled){if(t.tagName==='A')e.preventDefault();const f=DO[t.dataset.do];if(f)f(t,e)}else if(!e.target.closest('.panel')){$$('.panel').forEach(p=>p.remove())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modals .overlay'))closeTop();else if($('.panel'))$$('.panel').forEach(x=>x.remove())}if(e.key==='Enter'&&e.target.matches&&e.target.matches('a[data-do]'))e.target.click()});
document.addEventListener('change',e=>{if(e.target.id==='p_org'){const w=$('#p_cow');if(w)w.hidden=e.target.value==='in'}});
document.addEventListener('input',e=>{if(e.target.id==='pin'&&e.target.value.length===6){const f=e.target.closest('form');if(f&&f.requestSubmit)f.requestSubmit()}});
document.addEventListener('submit',async e=>{const fm=e.target.closest('[data-form]');if(!fm)return;e.preventDefault();const k=fm.dataset.form;const btn=$('button',fm);
 if(k==='email'){const email=$('#email').value.trim();await busy(btn,()=>call('loginStart',{email}),'กำลังตรวจสอบ…').then(r=>renderLogin(r.mode,email)).catch(()=>{})}
 if(k==='pin'){await busy(btn,async()=>{const r=await call('loginPin',{email:S.loginEmail,pin:$('#pin').value.trim()});S.token=r.token;store.set(r.token);await enter()},'กำลังตรวจสอบ…').catch(()=>{const i=$('#pin');if(i){i.value='';i.focus()}})}
 if(k==='setpin'){const a=$('#pin1').value.trim(),b=$('#pin2').value.trim();if(a!==b)return toast('PIN สองช่องไม่ตรงกัน',true);await busy(btn,async()=>{await call('setPin',{pin:a});S.askPin='';await enter()}).catch(()=>{})}
 if(k==='otp'){await busy(btn,async()=>{const r=await call('verifyOtp',{email:S.loginEmail,code:$('#code').value.trim()});S.token=r.token;store.set(r.token);S.askPin=r.me&&r.me.needPin?r.token:'';await enter()},'กำลังตรวจสอบ…').catch(()=>{})}
 if(k==='empid'){const id=$('#e_id').value.trim(),ph=$('#e_ph').value.trim();if(!id||!ph)return;S.empTry={empId:id,phone:ph};await busy(btn,async()=>{const r=await call('verifyEmployee',{empId:id,phone:ph});if(!r.ok){S.empErr={left:r.left};renderProfile();const b=$('#e_err');if(b)b.scrollIntoView({block:'center'});return}S.empErr=null;S.emp=Object.assign({},r.emp,{existing:r.existing||null});renderProfile()},'กำลังตรวจสอบ…').catch(()=>{})}
 if(k==='empok'){await busy(btn,async()=>{const me=await call('confirmEmployee',{});if(me&&me.token){S.token=me.token;store.set(me.token)}S.emp=null;S.empTry=null;S.empErr=null;S.me=me;renderEmpDone()}).catch(()=>{S.emp=null;renderProfile()})}
 if(k==='profile'){await busy(btn,async()=>{const org=$('#p_org');await call('saveProfile',{name:$('#p_name').value,department:$('#p_dept').value,company:org&&org.value==='in'?'Unique':$('#p_co')?$('#p_co').value:'',phone:$('#p_phone')?$('#p_phone').value:''});await enter()}).catch(()=>{})}
 if(k==='creply'){const i=$('#ctText');const text=i.value.trim();if(!text)return;await busy(btn,async()=>{const d=await call('contactReply',{email:fm.dataset.e,text});i.value='';const c=$('.ct-chat');if(c){c.innerHTML=ctHtml(d.items);c.scrollTop=c.scrollHeight}toast(d.line?'ส่งเข้า LINE ของพนักงานแล้ว':'ส่งข้อความแล้ว')},false).catch(()=>{})}
 if(k==='chat'){const i=$('#chatText');const text=i.value.trim();if(!text)return;await busy(btn,async()=>{const m=await call('sendMessage',{id:S.cur.id,text});i.value='';const o=btn.closest('.overlay');paintChat(m,o);const c=$('.chat',o);c.scrollTop=c.scrollHeight},false).catch(()=>{})}});
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const tip=$('#tip');if(t){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-270)+'px';tip.style.top=(e.clientY+14)+'px'}else tip.style.display='none'});
function lineConfirm(name,link,yes,no){window.__booted=true;$('#app').innerHTML=`<div class="login"><div class="hdr">${LOGO}</div><div class="wrap"><div><h1>ยืนยันบัญชี LINE</h1></div><div class="box"><h2>${link?'เชื่อมบัญชี LINE นี้':'เข้าสู่ระบบด้วยบัญชี LINE นี้'}ใช่หรือไม่</h2><p style="margin:10px 0 16px;font-size:18px;font-weight:600">${esc(name||'-')}</p><p class="hint" style="margin-bottom:16px">ถ้าไม่ใช่บัญชี LINE ของคุณ ให้กด "ไม่ใช่" แล้วเริ่มใหม่</p><button class="btn primary block" id="lcYes">ใช่ ดำเนินการต่อ</button><button class="btn ghost block" id="lcNo" style="margin-top:8px">ไม่ใช่</button></div></div></div>`;$('#lcYes').onclick=yes;$('#lcNo').onclick=no}
function lineReturn(){const B=document.body.dataset;const ticket=B.lt,st=B.ls||'',name=B.ln||'';B.lt='';let saved='';try{saved=localStorage.getItem('signq.ls')||'';localStorage.removeItem('signq.ls')}catch(e){}
 const link=st.charAt(0)==='k'&&!!S.token;const back=()=>{if(S.token)enter().catch(()=>{if(S.token)renderLogin()});else renderLogin()};
 const run=async()=>{$('#app').innerHTML='<div class="loading">กำลังยืนยันตัวตนกับ LINE…</div>';try{if(link){await call('lineLink',{ticket});initCache.set(null,null);toast('เชื่อมบัญชี LINE แล้ว ระบบจะแจ้งเตือนทาง LINE')}else{const r=await call('lineLogin',{ticket});initCache.set(null,null);S.token=r.token;store.set(r.token);
   try{const d=JSON.parse(localStorage.getItem('signq.lv')||'null');if(d){document.body.dataset.view=d.v||'';document.body.dataset.tour=d.t||''}}catch(e){}}
  try{localStorage.removeItem('signq.lv')}catch(e){}
  await enter()}catch(e){toast(e.message||'ยืนยันตัวตนด้วย LINE ไม่สำเร็จ',true);back()}};
 if(B.lok==='1'||(saved&&saved===st))run();else lineConfirm(name,link,run,back)}
function moveBar(){const B=document.body.dataset;if(WEB||!B.web||document.getElementById('movebar'))return;const q=new URLSearchParams();if(B.deep)q.set('req',B.deep);if(B.view)q.set('view',B.view);if(B.tour==='1')q.set('tour','1');const d=document.createElement('div');d.id='movebar';d.innerHTML=`<span>ระบบจองคิวย้ายไปลิงก์ใหม่แล้ว</span><a href="${esc(B.web+(q.toString()?'?'+q:''))}" target="_top">เปิดลิงก์ใหม่</a>`;document.body.insertBefore(d,document.body.firstChild)}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#line-"]');if(!a)return;e.preventDefault();liffGo(a.getAttribute('href').slice(6))},true);
async function liffGo(mode){const B=document.body.dataset;sstore('signq.out',null);try{localStorage.setItem('signq.lv',JSON.stringify({v:B.view||'',t:B.tour||''}))}catch(e){}
 try{await LIFFX.load()}catch(e){toast(e.message,true);return}
 if(liff.isLoggedIn())return mode==='k'?liffLink():liffLogin();
 sstore('signq.liffDo',mode==='k'?'link':'login');liff.login({redirectUri:location.href.split('#')[0]})}
async function liffLogin(){window.__booted=true;$('#app').innerHTML='<div class="loading">กำลังยืนยันตัวตนกับ LINE…</div>';
 try{const r=await call('lineLogin',LIFFX.tok());initCache.set(null,null);S.token=r.token;store.set(r.token);const B=document.body.dataset;
  try{const d=JSON.parse(localStorage.getItem('signq.lv')||'null');if(d){if(!B.view)B.view=d.v||'';if(!B.tour)B.tour=d.t||''}}catch(e){}
  try{localStorage.removeItem('signq.lv')}catch(e){}
  await enter()}catch(e){toast(e.message||'ยืนยันตัวตนด้วย LINE ไม่สำเร็จ',true);S.autoTried=true;if(S.token)enter().catch(()=>renderLogin());else renderLogin()}}
async function liffLink(){try{await call('lineLink',LIFFX.tok());initCache.set(null,null);toast('เชื่อมบัญชี LINE แล้ว ระบบจะแจ้งเตือนทาง LINE')}catch(e){toast(e.message||'เชื่อมบัญชี LINE ไม่สำเร็จ',true)}if(S.token)await enter().catch(()=>{if(S.token)renderLogin()});else renderLogin()}
async function webBoot(){const B=document.body.dataset;let lerr='';
 if(LIFFX.want()){$('#app').innerHTML='<div class="loading">กำลังเปิดระบบ…</div>';try{await LIFFX.load()}catch(e){lerr=e.message}}
 const q=new URLSearchParams(location.search),req=q.get('req')||'',v=q.get('view')||'';
 B.deep=/^[A-Z0-9-]{1,30}$/.test(req)?req:'';B.view=['admin','book','mine','history','change','inbox','live','rounds','dash','contact'].includes(v)?v:'';B.tour=q.get('tour')==='1'?'1':'';
 const todo=sstore('signq.liffDo');sstore('signq.liffDo',null);S.token=store.get();
 if(LIFFX.ok&&liff.isLoggedIn()){if(todo==='link'&&S.token)return liffLink();if(todo==='login'||(!S.token&&LIFFX.client()&&!sstore('signq.out'))){S.autoTried=true;return liffLogin()}}
 if(S.token)return enter().catch(()=>{if(S.token)renderLogin()});
 renderLogin();if(lerr)toast(lerr,true)}
(function(){if(WEB)return webBoot();moveBar();S.token=store.get();const B=document.body.dataset;if(B.lt)return lineReturn();if(B.le&&!S.token){renderLogin();toast(B.le,true);return}
 if(S.token)return enter().catch(()=>{if(S.token)renderLogin()});
 if(B.auto==='1'&&B.line){S.fromLine=true}
 renderLogin()})();
</script>
